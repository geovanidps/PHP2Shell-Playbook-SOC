title: PHP2Shell - Shell ou utilitario filho de processo web
id: de0524fd-8d1e-465c-b6fd-e643acd6a1aa
name: php2shell_web_process_spawns_shell
status: experimental
description: >
  Processo de servidor web ou PHP iniciando shell ou ferramenta de transferencia/rede.
  Comportamento de pos-exploracao tipico de RCE em PHP (PHP2Shell, CVE-2026-109618 e CVE-2026-109619).
  Detecta o resultado da exploracao, nao a assinatura do exploit.
references:
  - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
author: Geovane da Costa Oliveira
date: 2026-10-22
tags:
  - attack.initial-access
  - attack.t1190
  - attack.execution
  - attack.t1059.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent:
    ParentImage|contains:
      - 'php-fpm'
      - 'php-cgi'
      - 'lsphp'
      - 'frankenphp'
      - '/apache2'
      - '/httpd'
      - '/nginx'
  selection_child:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/curl'
      - '/wget'
      - '/nc'
      - '/ncat'
      - '/python'
      - '/python3'
      - '/perl'
      - '/whoami'
  condition: selection_parent and selection_child
fields:
  - Computer
  - User
  - ParentImage
  - ParentCommandLine
  - Image
  - CommandLine
falsepositives:
  - Aplicacoes que chamam utilitarios legitimos (geracao de PDF, imagem, git, envio de e-mail). Crie excecoes por linha de comando completa e por host, nunca por nome generico de processo.
level: high
